<style>
  /* Better Practice brand palette: navy #001C2C, blue #00ACE7, cyan #64DFFF, grey #F2F2F2 */
  :root{
    --bg:#eef2f5; --panel:#ffffff; --ink:#10222e; --muted:#566a77; --line:#e1e8ee;
    --brand:#001c2c; --brand2:#0b7fb0; --blue:#00ace7; --cyan:#64dfff;
    --sss:#00ace7; --hdmf:#0a3a52;
    --warn:#b45309; --warn-bg:#fef3c7; --ok:#047857; --ok-bg:#d1fae5;
    --danger:#b91c1c; --danger-bg:#fee2e2; --shadow:0 1px 3px rgba(0,28,44,.08),0 1px 2px rgba(0,28,44,.05);
    --radius:12px;
    --font-body:"Source Sans 3","Source Sans Pro","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --font-head:"Libre Franklin","Source Sans 3","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-body);
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:700;font-family:var(--font-head);letter-spacing:-.2px}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--brand2);text-decoration:none}
  .hidden{display:none !important}

  /* LOGIN */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#001c2c 0%,#003a52 55%,#00ace7 135%);padding:20px;z-index:50}
  .login-card{background:var(--panel);width:100%;max-width:400px;border-radius:16px;
    box-shadow:0 20px 45px rgba(2,6,23,.35);padding:34px 30px 26px;text-align:center}
  .badge{width:60px;height:60px;border-radius:15px;margin:0 auto 14px;display:flex;align-items:center;
    justify-content:center;background:#fff;border:1px solid var(--line);padding:8px}
  .badge img{width:100%;height:100%;object-fit:contain;display:block}
  .login-card h1{font-size:20px;letter-spacing:.2px}
  .login-card .sub{color:var(--muted);font-size:12.5px;margin:4px 0 22px;text-transform:uppercase;letter-spacing:1.5px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;background:#fbfcfe;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:10px 15px;font-weight:650;font-size:13.5px;white-space:nowrap}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:#182f6f}
  .btn-primary.full{width:100%;justify-content:center;padding:11px 16px;font-size:14px}
  .btn-ghost{background:#eef2f7;color:var(--ink)}
  .btn-ghost:hover{background:#e2e8f2}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{background:#991b1b}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:7px}
  .login-msg{color:var(--danger);font-size:12.5px;min-height:16px;margin:2px 0 10px;text-align:left}
  .login-foot{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.6}

  /* SHELL */
  #app{min-height:100vh;display:flex;flex-direction:column}
  header.top{background:var(--brand);color:#fff;padding:0 18px;display:flex;align-items:center;gap:12px;
    height:56px;position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(2,6,23,.18)}
  header.top .logo{width:34px;height:34px;border-radius:8px;background:#fff;padding:4px;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  header.top .logo img{width:100%;height:100%;object-fit:contain;display:block}
  header.top .title{font-size:15px;font-weight:700;white-space:nowrap;font-family:var(--font-head)}
  header.top .title small{display:block;font-size:10px;opacity:.7;font-weight:500;letter-spacing:1px}
  header.top .spacer{flex:1}
  header.top .who{font-size:12px;opacity:.9;white-space:nowrap}
  header.top .who b{font-weight:650}
  .iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600}
  .iconbtn:hover{background:rgba(255,255,255,.26)}
  .menu{position:relative}
  .menu-pop{position:absolute;right:0;top:40px;background:#fff;color:var(--ink);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 12px 30px rgba(2,6,23,.2);min-width:210px;padding:6px;z-index:45}
  .menu-pop button{display:flex;width:100%;text-align:left;background:none;border:none;padding:9px 11px;border-radius:7px;
    font-size:13px;color:var(--ink);gap:8px;align-items:center}
  .menu-pop button:hover{background:#f1f5f9}
  .menu-pop hr{border:none;border-top:1px solid var(--line);margin:5px 0}

  nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);padding:0 12px;display:flex;gap:2px;
    position:sticky;top:56px;z-index:35;overflow-x:auto}
  nav.tabs button{background:none;border:none;padding:13px 14px;font-size:13.5px;font-weight:600;color:var(--muted);
    border-bottom:2.5px solid transparent;white-space:nowrap}
  nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
  nav.tabs button:hover{color:var(--ink)}

  main{padding:22px;max-width:1300px;width:100%;margin:0 auto;flex:1}
  .view{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:16px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .page-head .ht{flex:1;min-width:200px}
  .page-head h2{font-size:19px}
  .page-head p{color:var(--muted);margin:3px 0 0;font-size:13px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpi .val{font-size:23px;font-weight:750;margin-top:6px;letter-spacing:-.5px}
  .kpi .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi.accent-sss{border-top:3px solid var(--sss)}
  .kpi.accent-hdmf{border-top:3px solid var(--hdmf)}
  .kpi.accent-warn{border-top:3px solid var(--warn)}
  .kpi.accent-brand{border-top:3px solid var(--brand)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card h3{font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h3 .tag{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  .hbar-row{display:grid;grid-template-columns:135px 1fr 100px;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
  .hbar-row .nm{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar-track{background:#eef2f7;border-radius:6px;height:16px;overflow:hidden}
  .hbar-fill{height:100%;border-radius:6px}
  .hbar-row .amt{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar input[type=search],.toolbar select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--panel)}
  .toolbar input[type=search]{min-width:210px}
  .toolbar .count{color:var(--muted);font-size:12.5px;margin-left:auto}

  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:12.8px}
  thead th{background:#f6f8fb;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--ink)}
  thead th .arr{opacity:.5;font-size:9px}
  tbody td{padding:9px 12px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#f8fafd}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.act,th.act{text-align:right;white-space:nowrap}
  .clickable{cursor:pointer}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:650;letter-spacing:.3px}
  .pill.sss{background:#d3f0fb;color:#036b98}
  .pill.hdmf{background:#d6e1e8;color:#0a3a52}
  .pill.type{background:#f1f5f9;color:#475569}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.none{background:#f1f5f9;color:#94a3b8}
  .pill.closed{background:#e2e8f0;color:#475569}
  .var-neg{color:var(--danger);font-weight:650}
  .var-pos{color:var(--ok);font-weight:600}
  .muted{color:var(--muted)}
  .link{color:var(--brand2);font-weight:600;cursor:pointer}
  .rowbtn{background:#eef2f7;border:none;color:var(--ink);padding:5px 9px;border-radius:6px;font-size:11.5px;font-weight:600;margin-left:5px}
  .rowbtn:hover{background:#e2e8f2}
  .rowbtn.del:hover{background:var(--danger-bg);color:var(--danger)}

  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--brand2);font-weight:600;font-size:13px;margin-bottom:14px;background:none;border:none;padding:0}
  .detail-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:6px}
  .detail-head h2{font-size:20px}
  .detail-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:16px 0 20px}
  .fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
  .fact .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .fact .v{font-size:16px;font-weight:700;margin-top:4px}
  .notice{background:#fff8ed;border:1px solid #fde4bf;color:#92400e;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:16px}
  .notice.info{background:#eef4ff;border-color:#c7d7fe;color:#1e40af}

  footer.foot{padding:16px 22px;text-align:center;color:var(--muted);font-size:11.5px}

  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{background:var(--panel);border-radius:14px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 45px rgba(2,6,23,.4);max-height:90vh;overflow:auto}
  .modal.narrow{max-width:400px}
  .modal.wide{max-width:820px}
  .modal h3{font-size:16px;margin-bottom:16px}
  .modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr}}
  .form-msg{color:var(--danger);font-size:12.5px;min-height:15px;margin-top:6px}
  .form-msg.ok{color:var(--ok)}
  .hintline{font-size:11px;color:var(--muted);margin-top:4px}
  .gridtable input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;
    padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(2,6,23,.35);z-index:80;opacity:0;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  /* PRINT */
  #printArea{display:none}
  @media print{
    #login,#app,#toast,#modalHost{display:none !important}
    #printArea{display:block !important}
    body{background:#fff}
    .print-doc{max-width:100%;padding:0}
    .print-doc h1{font-size:20px;margin-bottom:2px}
    .print-doc .ph{color:#333;font-size:12px;margin-bottom:14px}
    .print-doc table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
    .print-doc th,.print-doc td{border:1px solid #bbb;padding:5px 7px;text-align:left}
    .print-doc td.num,.print-doc th.num{text-align:right}
    .print-doc h2{font-size:14px;margin:14px 0 6px}
    .print-doc .sig{margin-top:40px;font-size:12px}
  }
  .print-doc{font-family:"Segoe UI",system-ui,sans-serif;color:#111}
  @media(max-width:640px){
    header.top{flex-wrap:wrap;height:auto;min-height:52px;padding:8px 12px;gap:8px}
    header.top .title{font-size:13px}
    header.top .title small{display:none}
    header.top .spacer{display:none}
    header.top .who{font-size:11px;order:6;flex-basis:100%;margin-top:-2px}
    .iconbtn{padding:6px 9px;font-size:11.5px}
    main{padding:14px}
    .kpis{grid-template-columns:1fr 1fr;gap:10px}
    .kpi{padding:12px 13px} .kpi .val{font-size:18px}
    .page-head{align-items:stretch}
    .page-head .btn{flex:1;justify-content:center}
    .grid2{grid-template-columns:1fr}
    .facts{grid-template-columns:1fr 1fr}
    .toolbar{align-items:stretch}
    .toolbar input[type=search],.toolbar select{min-width:0;width:100%}
    .toolbar .count{margin-left:0}
    table{font-size:12px} thead th,tbody td{padding:8px 8px}
    .modal{padding:18px} .form-grid{grid-template-columns:1fr}
    nav.tabs button{padding:11px 10px;font-size:12.5px}
    .detail-actions{width:100%} .detail-actions .btn{flex:1}
  }
</style>

<script>
/* ===================== MONTHS ===================== */
const MONTH_NAMES=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const MONTHS=[]; const MIDX={};
for(let y=2023;y<=2029;y++){ for(let m=0;m<12;m++){ const s=MONTH_NAMES[m]+" "+y; MIDX[s]=MONTHS.length; MONTHS.push(s); } }
const monthIndex=s=>(s in MIDX)?MIDX[s]:-1;
const nextMonth=s=>{const i=monthIndex(s);return(i>=0&&i+1<MONTHS.length)?MONTHS[i+1]:"";};
function currentMonthName(){const d=new Date();return MONTH_NAMES[d.getMonth()]+" "+d.getFullYear();}
const SELECT_MONTHS=MONTHS.filter(m=>monthIndex(m)<=monthIndex(currentMonthName())+12);
const PAYMENT_TYPES=["REGULAR","ADVANCE","ARREARS CATCH-UP","ADJUSTMENT","FULL SETTLEMENT"];
const AGENCY_TYPES={SSS:[["SL","SL - Salary Loan"],["CL","CL - Calamity Loan"]],
  HDMF:[["MPL","MPL - Multi-Purpose Loan"],["CL","CL - Calamity Loan"]]};
const AGENCIES=[["SSS","SSS"],["HDMF","Pag-IBIG (HDMF)"]];

/* ===================== SUPABASE + STORE ===================== */
const SUPABASE_URL="https://azaciliompsnpigqxmvz.supabase.co";
const SUPABASE_KEY="sb_publishable_pgYfBGE4Ta8my7R07Jpl6Q_AQ3dVMhQ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let STORE={employees:[],loans:[],entries:[]};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"id"+Date.now()+Math.random().toString(36).slice(2,8));
const num=x=>(x===null||x===undefined||x==="")?null:Number(x);
function rowToLoan(r){return {id:r.id,employee:r.employee,agency:r.agency,loanType:r.loan_type,
  loanAmount:num(r.loan_amount),monthlyAmort:num(r.monthly_amort),totalPayable:num(r.total_payable),
  termMonths:(r.term_months==null?null:Number(r.term_months)),firstMonth:r.first_month,reference:r.reference,
  status:r.status||"active",notes:r.notes};}
function rowToEntry(r){return {id:r.id,loanId:r.loan_id,applicableMonth:r.applicable_month,orRef:r.or_ref,
  first15:num(r.first15),second15:num(r.second15),totalRecorded:num(r.total_recorded),
  paymentType:r.payment_type||"REGULAR",remarks:r.remarks};}
async function loadData(){
  const [emp,loans,ents,profs]=await Promise.all([
    sb.from("employees").select("name,email").order("name"),
    sb.from("loans").select("*"),
    sb.from("ledger_entries").select("*"),
    sb.from("profiles").select("id,full_name,email,role,employee")]);
  if(loans.error) throw loans.error;
  if(ents.error) throw ents.error;
  const L=(loans.data||[]).map(rowToLoan);
  const E=(ents.data||[]).map(rowToEntry);
  const empRows=(emp.data||[]);
  let names=empRows.map(r=>r.name);
  if(!names.length) names=[...new Set(L.map(l=>l.employee))].sort();
  const empEmail={}; empRows.forEach(r=>{ if(r.email) empEmail[r.name]=r.email; });
  STORE={employees:names,empEmail,loans:L,entries:E,profiles:(profs&&profs.data)||[]};
}
async function reloadRender(){ try{await loadData();}catch(err){toast("Reload failed: "+(err.message||err));} (CURRENT_ROLE==="member")?renderMember():render(); }
async function logAudit(action,entity,entity_id){ try{const {data:{user}}=await sb.auth.getUser(); await sb.from("audit_log").insert({actor:user.id,actor_name:CURRENT_USER,action,entity,entity_id:String(entity_id||"")});}catch(e){} }
function saveStore(){}

/* ===================== DERIVATIONS ===================== */
function round2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function halvesOf(e){return (e.first15||0)+(e.second15||0);}
function hasHalves(e){return typeof e.first15==="number"||typeof e.second15==="number";}
function appliedOf(e){return (typeof e.totalRecorded==="number")?e.totalRecorded:halvesOf(e);}
function needsReview(e){return hasHalves(e)&&typeof e.totalRecorded==="number"&&round2(e.totalRecorded)!==round2(halvesOf(e));}
function varianceOf(e){return needsReview(e)?round2(appliedOf(e)-halvesOf(e)):0;}
function issueOf(e){ if(!needsReview(e))return""; if(round2(e.totalRecorded)===0)return"Total recorded as 0, halves ignored"; return"Total recorded does not match the two halves"; }
const loanById=id=>STORE.loans.find(l=>l.id===id);
function entriesForLoan(l){ return STORE.entries.filter(e=>e.loanId===l.id).sort((a,b)=>monthIndex(a.applicableMonth)-monthIndex(b.applicableMonth)); }
// The full amount that must be repaid over the life of the loan (principal + interest).
// Priority: an explicit total, else amortization x term, else the principal as a fallback.
function obligationOf(l){
  if(typeof l.totalPayable==="number") return l.totalPayable;
  if(typeof l.monthlyAmort==="number" && typeof l.termMonths==="number") return round2(l.monthlyAmort*l.termMonths);
  if(typeof l.loanAmount==="number") return l.loanAmount;
  return null;
}
function loanStats(l){
  const es=entriesForLoan(l);
  let totalPaid=0,monthsPaid=0,lastIdx=-1,lastMonth="none",varRows=0;
  es.forEach(e=>{ const ap=appliedOf(e); totalPaid+=ap; if(ap>0)monthsPaid++;
    const i=monthIndex(e.applicableMonth); if(i>lastIdx){lastIdx=i;lastMonth=e.applicableMonth;}
    if(varianceOf(e)!==0)varRows++; });
  totalPaid=round2(totalPaid);
  const s={entries:es,totalPaid,monthsPaid,lastMonth,lastIdx,varRows};
  const ob=obligationOf(l);
  if(typeof ob==="number"){ s.obligation=ob; s.balance=round2(ob-totalPaid); s.fullyPaid=s.balance<=0; }
  if(typeof l.monthlyAmort==="number"&&l.firstMonth){
    const elapsed=Math.max(0,monthIndex(currentMonthName())-monthIndex(l.firstMonth)+1);
    s.expected=round2(elapsed*l.monthlyAmort); s.advance=round2(totalPaid-s.expected);
    if(typeof s.balance==="number"&&l.monthlyAmort>0&&s.balance>0){ s.monthsToFull=Math.ceil(s.balance/l.monthlyAmort);
      const endIdx=monthIndex(currentMonthName())+s.monthsToFull; if(endIdx>=0&&endIdx<MONTHS.length)s.projectedEnd=MONTHS[endIdx]; }
  }
  return s;
}
function loanState(l){ // one-word lifecycle for display
  if(l.status==="closed")return "closed";
  const s=loanStats(l);
  if(s.fullyPaid)return "fully paid";
  return "active";
}
function missedMonths(l){
  const es=entriesForLoan(l); if(!l.firstMonth||!es.length)return [];
  const first=monthIndex(l.firstMonth); let last=-1; const have=new Set();
  es.forEach(e=>{const i=monthIndex(e.applicableMonth); have.add(i); if(i>last)last=i;});
  const miss=[]; for(let i=Math.max(first,0);i<=last;i++) if(!have.has(i))miss.push(MONTHS[i]);
  return miss;
}
function allExceptions(){
  return STORE.entries.filter(needsReview).map(e=>({e,l:loanById(e.loanId)})).filter(x=>x.l)
    .sort((a,b)=> a.l.agency.localeCompare(b.l.agency)||a.l.employee.localeCompare(b.l.employee)||monthIndex(a.e.applicableMonth)-monthIndex(b.e.applicableMonth));
}
function loanLabel(l){ return `${l.employee} - ${l.agency==='SSS'?'SSS':'Pag-IBIG'} ${l.loanType}${l.reference?' ('+l.reference+')':''}`; }
function agencyDisp(a){return a==='SSS'?'SSS':'Pag-IBIG';}

function caps(){ const r=CURRENT_ROLE; return {admin:r==="admin", loans:r==="admin", employees:r==="admin", pay:(r==="admin"||r==="encoder"), post:(r==="admin"||r==="encoder"), exceptions:(r==="admin"||r==="encoder")}; }

async function doLogin(e){

  if(email && !email.includes("@")) email=email+"@bploans.local"; // plain usernames map to the internal domain
  const msg=document.getElementById("loginMsg"); msg.textContent="Signing in...";
  const {error}=await sb.auth.signInWithPassword({email,password:p});
  if(error){ msg.textContent=error.message||"Sign in failed."; document.getElementById("p").value=""; return; }
  await onSignedIn();

async function onSignedIn(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){ showLogin(); return; }
  CURRENT_USER=user.email;
  const {data:prof}=await sb.from("profiles").select("role,employee,full_name").eq("id",user.id).maybeSingle();
  CURRENT_ROLE=(prof&&prof.role)||"member"; CURRENT_EMP=(prof&&prof.employee)||null;

async function saveUserRow(id){
  if(!need("admin"))return;
  const tr=document.querySelector(`#main tr[data-uid="${id}"]`); if(!tr)return;
  const role=tr.querySelector(".uRole").value;
  const employee=tr.querySelector(".uEmp").value||null;
  const before=(STORE.profiles||[]).find(p=>p.id===id)||{};
  const admins=(STORE.profiles||[]).filter(p=>p.role==="admin");
  if(before.role==="admin" && role!=="admin" && admins.length<=1){
    toast("This is the only admin. Assign another admin first."); return;
  }
  const {error}=await sb.from("profiles").update({role,employee}).eq("id",id);
  if(error){ toast("Update failed: "+error.message); return; }
  await logAudit("role_change",`profile:${role}`,id);
  toast("Saved. "+esc(before.full_name||before.email||"Account")+" is now "+roleLabel(role));
  await loadData();
  const me=(STORE.profiles||[]).find(p=>p.email===CURRENT_USER);
  if(me){ CURRENT_ROLE=me.role||CURRENT_ROLE; CURRENT_EMP=me.employee||null; applyRoleUI(); }
  render();
}

    <div class="kpis">
      <div class="kpi accent-brand"><div class="lab">Loans on file</div><div class="val">${L.length}</div><div class="hint">${active} active, ${borrowers} borrowers</div></div>
      <div class="kpi accent-brand"><div class="lab">Total paid to date</div><div class="val">${peso(totalPaid)}</div><div class="hint">across all loans</div></div>

      <div class="kpi accent-hdmf"><div class="lab">Pag-IBIG paid</div><div class="val">${peso(hdmfPaid)}</div><div class="hint">${L.filter(l=>l.agency==='HDMF').length} loans</div></div>

    <div class="grid2">
      <div class="card"><h3>Total paid by agency <span class="tag">share of ${peso(totalPaid)}</span></h3>${donutSVG(sssPaid,hdmfPaid)}

function attentionPanel(o){

  </div>`;

function donutSVG(a,b){ const tot=a+b||1,r=52,c=2*Math.PI*r,aLen=a/tot*c;
  return `<svg viewBox="0 0 140 140" width="150" height="150" style="display:block;margin:4px auto 0">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#eef2f7" stroke-width="20"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--hdmf)" stroke-width="20" stroke-dasharray="${c}" transform="rotate(-90 70 70)"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--sss)" stroke-width="20" stroke-dasharray="${aLen} ${c-aLen}" transform="rotate(-90 70 70)"/>
    <text x="70" y="66" text-anchor="middle" font-size="12" fill="#5b6577">SSS</text>
    <text x="70" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2130">${(a/tot*100).toFixed(0)}%</text></svg>`; }
function trendSVG(){
  const map={};
  STORE.entries.forEach(e=>{const i=monthIndex(e.applicableMonth); if(i<0)return; map[i]=(map[i]||0)+appliedOf(e);});
  const idxs=Object.keys(map).map(Number).sort((a,b)=>a-b);
  if(!idxs.length)return '<p class="muted">No payments recorded.</p>';
  const start=idxs[0],end=idxs[idxs.length-1];
  const series=[]; for(let i=start;i<=end;i++)series.push({i,v:round2(map[i]||0)});
  const shown=series.slice(-18);
  const max=Math.max(...shown.map(p=>p.v),1);
  const W=520,H=150,pad=24,bw=(W-pad*2)/shown.length;
  const bars=shown.map((p,k)=>{const h=(p.v/max)*(H-pad*2);const x=pad+k*bw;const y=H-pad-h;
    return `<rect x="${x+2}" y="${y}" width="${bw-4}" height="${h}" rx="2" fill="var(--sss)"><title>${MONTHS[p.i]}: ${'\u20B1'}${p.v.toLocaleString('en-PH',{minimumFractionDigits:2})}</title></rect>`;}).join("");
  const labs=shown.map((p,k)=>{ if(shown.length>10&&k%3!==0)return""; const x=pad+k*bw+bw/2;
    const [mn,yr]=MONTHS[p.i].split(" "); return `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="#94a3b8">${mn.slice(0,3)} ${yr.slice(2)}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e2e7ef"/>${bars}${labs}</svg>
    <div class="hintline" style="text-align:right">peak month ${'\u20B1'}${max.toLocaleString('en-PH',{minimumFractionDigits:2})}</div>`;
}

function sortArr(col){ return STATE.loanSort.col===col?`<span class="arr">${STATE.loanSort.dir>0?'&#9650;':'&#9660;'}</span>`:'<span class="arr">&#8645;</span>'; }
function sortLoans(col){ const s=STATE.loanSort; if(s.col===col)s.dir*=-1; else{s.col=col;s.dir=1;} document.getElementById("loanRows").innerHTML=loanRowsHTML(); document.querySelector('#main').innerHTML=viewLoans(); bindDynamic(); }
function loanRowsHTML(){
  const q=(document.getElementById("fSearch")?.value||"").toLowerCase();
  const ag=document.getElementById("fAgency")?.value||"", ty=document.getElementById("fType")?.value||"", st=document.getElementById("fStatus")?.value;
  let rows=STORE.loans.map(l=>({l,s:loanStats(l)})).filter(x=>
    (!q||x.l.employee.toLowerCase().includes(q))&&(!ag||x.l.agency===ag)&&(!ty||x.l.loanType===ty)&&(st===""||x.l.status===st||(st===undefined)));
  const sc=STATE.loanSort.col,dir=STATE.loanSort.dir;
  rows.sort((a,b)=>{ let av,bv;
    if(sc==="employee"){av=a.l.employee;bv=b.l.employee;return av.localeCompare(bv)*dir;}
    if(sc==="loanAmount"){av=a.l.loanAmount??-1;bv=b.l.loanAmount??-1;}
    else if(sc==="balance"){av=a.s.balance??-1;bv=b.s.balance??-1;}
    else if(sc==="totalPaid"){av=a.s.totalPaid;bv=b.s.totalPaid;}

/* ===================== IMPORT / EXPORT DEDUCTIONS ===================== */
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadTemplate(){
  if(!need("pay"))return;
  const month=(document.getElementById("pMonth")?.value)||currentMonthName();
  const active=STORE.loans.filter(l=>l.status==="active").sort((a,b)=>a.employee.localeCompare(b.employee)||a.agency.localeCompare(b.agency));
  const head=["Employee","Agency","LoanType","Reference","Month","First15","Second15","Total","PaymentType"];
  const lines=[head.join(",")];
  active.forEach(l=>lines.push([csvCell(l.employee),l.agency,l.loanType,csvCell(l.reference||""),month,"","","","REGULAR"].map(csvCell).join(",")));
  const blob=new Blob([lines.join("\r\n")],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="deduction-template-"+month.replace(/\s+/g,"-")+".csv"; a.click(); URL.revokeObjectURL(a.href);
  toast("Template downloaded, fill the amount columns then Import CSV");
}
function parseCSV(text){
  const rows=[]; let i=0,f="",row=[],q=false; text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++;continue; }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f="";i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=c;i++; }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function importDeductions(ev){
  if(!need("pay"))return;
  const file=ev.target.files[0]; if(!file)return; const rd=new FileReader();
  rd.onload=()=>{ ev.target.value="";
    const rows=parseCSV(rd.result); if(rows.length<2){toast("That file has no data rows");return;}
    const hdr=rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]/g,""));
    const col=n=>hdr.indexOf(n);
    const ci={emp:col("employee"),ag:col("agency"),lt:col("loantype"),ref:col("reference"),mo:col("month"),h1:col("first15"),h2:col("second15"),tot:col("total"),pt:col("paymenttype")};
    if(ci.emp<0||ci.mo<0){toast("File needs at least Employee and Month columns");return;}
    const pn=v=>{v=String(v||"").replace(/[₱,\s]/g,"").trim(); if(v==="")return null; const n=Number(v); return isNaN(n)?null:round2(n);};
    const normAg=a=>{a=String(a||"").toUpperCase(); return (a.includes("PAG")||a==="HDMF")?"HDMF":"SSS";};
    const items=[];
    for(let k=1;k<rows.length;k++){ const r=rows[k];
      const emp=(r[ci.emp]||"").trim(); if(!emp)continue;
      const ag=normAg(r[ci.ag]); const lt=(r[ci.lt]||"").trim().toUpperCase();
      const ref=ci.ref>=0?(r[ci.ref]||"").trim():"";
      const mo=(r[ci.mo]||"").trim().toUpperCase();
      const h1=pn(r[ci.h1]),h2=pn(r[ci.h2]),tot=pn(r[ci.tot]);
      const pt=ci.pt>=0?((r[ci.pt]||"").trim().toUpperCase()||"REGULAR"):"REGULAR";
      if(h1===null&&h2===null&&tot===null)continue;
      let loan=STORE.loans.find(l=>l.employee.toLowerCase()===emp.toLowerCase()&&l.agency===ag&&l.loanType===lt&&(ref?(l.reference||"").toLowerCase()===ref.toLowerCase():true));
      if(!loan) loan=STORE.loans.find(l=>l.employee.toLowerCase()===emp.toLowerCase()&&l.agency===ag&&l.loanType===lt);
      let status,loanId=null;
      if(!(mo in MIDX)) status="bad month";
      else if(!loan) status="no matching loan";
      else { loanId=loan.id; status=STORE.entries.find(e=>e.loanId===loan.id&&e.applicableMonth===mo)?"already posted":"will post"; }
      items.push({emp,ag,lt,mo,h1,h2,tot,pt,status,loanId});
    }
    previewImport(items);
  };
  rd.readAsText(file);
}
function previewImport(items){
  const willPost=items.filter(x=>x.status==="will post");
  const skipped=items.filter(x=>x.status==="already posted").length;
  const bad=items.filter(x=>x.status==="no matching loan"||x.status==="bad month").length;
  window.__importQueue=willPost;
  const body=items.map(x=>{ const applied=(typeof x.tot==="number")?x.tot:round2((x.h1||0)+(x.h2||0));
    const tone=x.status==="will post"?"ok":(x.status==="already posted"?"none":"warn");
    return `<tr><td>${esc(x.emp)}</td><td>${x.ag==='SSS'?'SSS':'Pag-IBIG'} ${esc(x.lt)}</td><td>${esc(x.mo)}</td><td class="num">${peso(applied)}</td><td><span class="pill ${tone}">${x.status}</span></td></tr>`;}).join("");
  modal(`<h3>Import preview</h3>
    <p class="hintline" style="margin-bottom:10px"><b>${willPost.length}</b> will be posted &middot; ${skipped} already posted (skipped) &middot; ${bad} could not be matched. Matching uses employee name, agency, and loan type.</p>
    <div class="tablewrap" style="box-shadow:none;max-height:50vh"><table><thead><tr><th>Employee</th><th>Loan</th><th>Month</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>${body||'<tr><td colspan="5" class="muted" style="padding:14px">No rows with amounts found.</td></tr>'}</tbody></table></div>
    <div class="form-msg" id="impMsg"></div>
    <div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="commitImport()" ${willPost.length?'':'disabled'}>Post ${willPost.length} payment${willPost.length!==1?'s':''}</button></div>`,"wide");
}
async function commitImport(){
  if(!need('pay'))return;
  const q=window.__importQueue||[]; if(!q.length){ closeModal(); return; }
  const rows=q.map(x=>({loan_id:x.loanId,applicable_month:x.mo,or_ref:null,first15:x.h1,second15:x.h2,total_recorded:x.tot,payment_type:x.pt,remarks:"imported from spreadsheet"}));
  const {error}=await sb.from("ledger_entries").insert(rows); if(error){ toast("Import failed: "+error.message); return; }
  window.__importQueue=null; logAudit("import","ledger",rows.length); closeModal(); toast(`Imported ${rows.length} payment${rows.length!==1?'s':''}`); await reloadRender();
}

function remitData(month){
  const rows=STORE.entries.filter(e=>e.applicableMonth===month).map(e=>({e,l:loanById(e.loanId)})).filter(x=>x.l);
  const sss=rows.filter(x=>x.l.agency==="SSS"), hdmf=rows.filter(x=>x.l.agency==="HDMF");
  const sum=arr=>round2(arr.reduce((a,x)=>a+appliedOf(x.e),0));
  return {rows,sss,hdmf,sssTot:sum(sss),hdmfTot:sum(hdmf),grand:sum(rows)};
}
function renderRemit(){

    html+=`<h2>${agencyDisp(l.agency)} ${esc(l.loanType)}${l.reference?' ('+esc(l.reference)+')':''}</h2>
      <p style="font-size:11px;margin:0 0 6px">Total to pay: ${typeof s.obligation==="number"?peso(s.obligation):"not set"} &middot; Monthly amortization: ${typeof l.monthlyAmort==="number"?peso(l.monthlyAmort):"n/a"} &middot; Total paid: ${peso(s.totalPaid)} &middot; Remaining balance: ${typeof s.balance==="number"?peso(s.balance):"n/a"} &middot; Paid through: ${s.lastMonth!=="none"?esc(s.lastMonth):"none"}${s.fullyPaid?" &middot; FULLY PAID":""}</p>

function printPayment(id){
  const e=STORE.entries.find(x=>x.id===id); if(!e)return; const l=loanById(e.loanId); if(!l)return;

  const info=`<table><tbody>

function syncLoanTypes(preset){
  const ag=document.getElementById("lfAgency").value, list=AGENCY_TYPES[ag]||[];
  const cur=(preset!==undefined&&preset!==null)?preset:document.getElementById("lfType").value;
  const keep=list.some(o=>o[0]===cur)?cur:list[0][0];
  document.getElementById("lfType").innerHTML=opt(list,keep);
}
async function saveLoan(id){
  if(!need('loans'))return;
  const emp=document.getElementById("lfEmp").value, agency=document.getElementById("lfAgency").value, loanType=document.getElementById("lfType").value;
  const amt=fnum("lfAmt"),amort=fnum("lfAmort"),total=fnum("lfTotal"),termRaw=fnum("lfTerm");
  const firstMonth=document.getElementById("lfFirst").value||null,reference=document.getElementById("lfRef").value.trim()||null,notes=document.getElementById("lfNotes").value.trim()||null;
  const term=(typeof termRaw==="number")?Math.round(termRaw):termRaw;
  const msg=document.getElementById("lfMsg");
  if(!emp){msg.textContent="Choose an employee.";return;}
  if(isNaN(amt)||isNaN(amort)||isNaN(total)||isNaN(term)){msg.textContent="Amounts and term must be numbers.";return;}
  const dup=STORE.loans.find(l=>l.id!==id&&l.employee===emp&&l.agency===agency&&l.loanType===loanType&&l.status==="active");
  if(dup&&!reference){msg.textContent=`${emp} already has an active ${agencyDisp(agency)} ${loanType} loan. Add a reference to keep a second one, or edit the existing loan.`;return;}
  const rec={employee:emp,agency,loan_type:loanType,loan_amount:amt,monthly_amort:amort,total_payable:total,term_months:term,first_month:firstMonth,reference,notes};
  try{ let res=id?await sb.from("loans").update(rec).eq("id",id):await sb.from("loans").insert(rec); if(res.error)throw res.error; }
  catch(err){ msg.textContent="Save failed: "+(err.message||err); return; }
  logAudit(id?"update":"create","loan",id||(emp+"|"+agency+"|"+loanType));
  closeModal(); toast(id?"Loan updated":"Loan added"); await reloadRender();
}
function deleteLoan(id){
  if(!need('loans'))return;
  const l=loanById(id); if(!l)return; const n=entriesForLoan(l).length;
  confirmModal(`Delete the ${agencyDisp(l.agency)} ${l.loanType} loan for <b>${esc(l.employee)}</b>?`,
    n?`This also deletes its ${n} payment entr${n>1?'ies':'y'}. This cannot be undone.`:`This cannot be undone.`,
    (async()=>{ const {error}=await sb.from("loans").delete().eq("id",id); if(error){toast("Delete failed: "+error.message);return;}
      logAudit("delete","loan",id); toast("Loan deleted"); const back=STATE.view==="loanDetail"; await loadData(); if(back){go("loans");} else {(CURRENT_ROLE==="member")?renderMember():render();} }));
}

function bulkAmounts(){
  if(!need("loans"))return;
  const rows=STORE.loans.slice().sort((a,b)=>a.employee.localeCompare(b.employee)).map(l=>`
    <tr data-loan="${l.id}"><td>${esc(l.employee)}</td><td>${agencyPill(l.agency)} ${typePill(l.loanType)}</td>
    <td><input type="text" inputmode="decimal" class="baTotal" placeholder="total to pay" value="${typeof l.totalPayable==='number'?l.totalPayable:''}"></td>
    <td><input type="text" inputmode="numeric" class="baTerm" placeholder="term" value="${typeof l.termMonths==='number'?l.termMonths:''}"></td>
    <td><input type="text" inputmode="decimal" class="baAmort" placeholder="amort" value="${typeof l.monthlyAmort==='number'?l.monthlyAmort:''}"></td>
    <td><input type="text" inputmode="decimal" class="baAmt" placeholder="principal" value="${typeof l.loanAmount==='number'?l.loanAmount:''}"></td></tr>`).join("");
  modal(`<h3>Set loan amounts</h3><p class="hintline" style="margin-bottom:10px">Enter each loan's total to be paid (or the term plus amortization) to activate the remaining balance and payoff estimates. Principal is optional.</p>
    <div class="tablewrap" style="box-shadow:none;max-height:52vh"><table class="gridtable"><thead><tr><th>Employee</th><th>Loan</th><th style="width:120px">Total to pay</th><th style="width:80px">Term</th><th style="width:110px">Amortization</th><th style="width:110px">Principal</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="form-msg" id="baMsg"></div><div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveBulkAmounts()">Save all</button></div>`,"wide");
}
async function saveBulkAmounts(){
  if(!need('loans'))return;
  const ops=[];
  document.querySelectorAll("#modalHost tr[data-loan]").forEach(tr=>{
    const l=loanById(tr.dataset.loan); const pn=v=>{v=(v||"").trim();if(v==="")return null;const n=Number(v.replace(/,/g,""));return isNaN(n)?undefined:round2(n);};
    const amt=pn(tr.querySelector(".baAmt").value), amort=pn(tr.querySelector(".baAmort").value);
    const total=pn(tr.querySelector(".baTotal").value), term=pn(tr.querySelector(".baTerm").value);
    const patch={};
    if(amt!==undefined&&amt!==l.loanAmount)patch.loan_amount=amt;
    if(amort!==undefined&&amort!==l.monthlyAmort)patch.monthly_amort=amort;
    if(total!==undefined&&total!==l.totalPayable)patch.total_payable=total;
    if(term!==undefined){const t=term===null?null:Math.round(term); if(t!==l.termMonths)patch.term_months=t;}
    if(Object.keys(patch).length)ops.push({id:l.id,patch});
  });
  if(!ops.length){ closeModal(); toast("No changes"); return; }
  try{ for(const o of ops){ const {error}=await sb.from("loans").update(o.patch).eq("id",o.id); if(error)throw error; } }
  catch(err){ toast("Save failed: "+(err.message||err)); return; }
  closeModal(); toast(`Updated ${ops.length} loan${ops.length>1?'s':''}`); await reloadRender();
}

function editEntry(id,presetLoanId){
  if(!need("pay"))return;
  const e=id?STORE.entries.find(x=>x.id===id):null;
  const loans=STORE.loans.slice().sort((a,b)=>a.employee.localeCompare(b.employee));
  if(!loans.length){ modal(`<h3>No loans yet</h3><p class="muted">Add a loan first, then record payments against it.</p><div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="closeModal();editLoan()">Add loan</button></div>`,"narrow"); return; }
  let curLoanId=presetLoanId||(e?e.loanId:"")||loans[0].id;
  const loanOpts=loans.map(l=>`<option value="${l.id}" ${l.id===curLoanId?'selected':''}>${esc(loanLabel(l))}</option>`).join("");
  modal(`<h3>${e?'Edit payment entry':'Record payment'}</h3><div class="form-grid">
    <div class="field full"><label>Loan</label><select id="efLoan">${loanOpts}</select></div>
    <div class="field"><label>Applicable month</label><select id="efMonth">${opt(SELECT_MONTHS,e?e.applicableMonth:currentMonthName())}</select><div class="hintline">Payment is due the following month.</div></div>
    <div class="field"><label>Payment type</label><select id="efType">${opt(PAYMENT_TYPES,e?e.paymentType:'REGULAR')}</select></div>
    <div class="field"><label>1st - 15th (&#8369;)</label><input id="efH1" type="text" inputmode="decimal" placeholder="0.00" value="${e&&typeof e.first15==='number'?e.first15:''}"></div>
    <div class="field"><label>16th - 30th (&#8369;)</label><input id="efH2" type="text" inputmode="decimal" placeholder="0.00" value="${e&&typeof e.second15==='number'?e.second15:''}"></div>
    <div class="field"><label>Total as recorded (&#8369;)</label><input id="efTot" type="text" inputmode="decimal" placeholder="leave blank to use halves" value="${e&&typeof e.totalRecorded==='number'?e.totalRecorded:''}"><div class="hintline">Optional. Fill only if the payslip shows one combined total.</div></div>
    <div class="field"><label>OR / Ref no.</label><input id="efRef" type="text" value="${e&&e.orRef?esc(e.orRef):''}"></div>
    <div class="field full"><label>Remarks</label><input id="efRem" type="text" value="${e&&e.remarks?esc(e.remarks):''}"></div>
    </div><div class="form-msg" id="efMsg"></div>
    <div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEntry(${id?`'${id}'`:'null'})">${e?'Save changes':'Add payment'}</button></div>`);
}
async function saveEntry(id){
  if(!need('pay'))return;
  const loan=loanById(document.getElementById("efLoan").value);
  const applicableMonth=document.getElementById("efMonth").value, paymentType=document.getElementById("efType").value;
  const h1=fnum("efH1"),h2=fnum("efH2"),tot=fnum("efTot"),orRef=document.getElementById("efRef").value.trim()||null,remarks=document.getElementById("efRem").value.trim()||null;
  const msg=document.getElementById("efMsg");
  if(!loan){msg.textContent="Choose a loan.";return;}
  if(isNaN(h1)||isNaN(h2)||isNaN(tot)){msg.textContent="Amounts must be numbers.";return;}
  if(h1===null&&h2===null&&tot===null){msg.textContent="Enter at least one amount.";return;}
  const dup=STORE.entries.find(x=>x.id!==id&&x.loanId===loan.id&&x.applicableMonth===applicableMonth);
  if(dup){msg.textContent="An entry for "+applicableMonth+" already exists on this loan. Edit that entry instead.";return;}
  const rec={loan_id:loan.id,applicable_month:applicableMonth,or_ref:orRef,first15:h1,second15:h2,total_recorded:tot,payment_type:paymentType,remarks};
  try{ let res=id?await sb.from("ledger_entries").update(rec).eq("id",id):await sb.from("ledger_entries").insert(rec); if(res.error)throw res.error; }
  catch(err){ msg.textContent="Save failed: "+(err.message||err); return; }
  logAudit(id?"update":"create","payment",loan.employee+" "+applicableMonth);
  closeModal(); toast(id?"Payment updated":"Payment recorded"); await reloadRender();
}
function deleteEntry(id){
  if(!need('pay'))return;
  const e=STORE.entries.find(x=>x.id===id); if(!e)return; const l=loanById(e.loanId);
  confirmModal(`Delete the ${esc(e.applicableMonth)} payment for <b>${esc(l?l.employee:'')}</b>?`,`This cannot be undone.`,
    (async()=>{ const {error}=await sb.from("ledger_entries").delete().eq("id",id); if(error){toast("Delete failed: "+error.message);return;} logAudit("delete","payment",id); toast("Payment deleted"); await reloadRender(); }));
}

function editEmployee(name){
  if(!need("employees"))return;
  const em=name?((STORE.empEmail||{})[name]||""):"";
  modal(`<h3>${name?'Edit employee':'Add employee'}</h3>
    <div class="field"><label>Full name (Surname, First name)</label>
    <input id="emName" type="text" value="${name?esc(name):''}" placeholder="e.g. Dela Cruz, Juan"></div>
    <div class="field"><label>Email (login reference)</label>
    <input id="emEmail" type="email" value="${esc(em)}" placeholder="e.g. juan.delacruz@gmail.com">
    <div class="hintline">This email links their self-service login to this record. When they sign in with it, they see only their own loans.</div></div>
    <div class="form-msg" id="emMsg"></div>
    <div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveEmployee(${name?`'${esc(name).replace(/'/g,"\\'")}'`:'null'})">${name?'Save':'Add'}</button></div>`,"narrow");
}
async function saveEmployee(oldName){
  if(!need('employees'))return;
  const nm=document.getElementById("emName").value.trim(), msg=document.getElementById("emMsg");
  const email=document.getElementById("emEmail").value.trim()||null;
  if(!nm){msg.textContent="Enter a name.";return;}
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.textContent="Enter a valid email, or leave it blank.";return;}
  if(STORE.employees.some(e=>e.toLowerCase()===nm.toLowerCase()&&e!==oldName)){msg.textContent="That employee already exists.";return;}
  try{
    if(oldName){ let r1=await sb.from("employees").update({name:nm,email}).eq("name",oldName); if(r1.error)throw r1.error;
      let r2=await sb.from("loans").update({employee:nm}).eq("employee",oldName); if(r2.error)throw r2.error;
      if(nm!==oldName){ await sb.from("profiles").update({employee:nm}).eq("employee",oldName); } }
    else { let r=await sb.from("employees").insert({name:nm,email}); if(r.error)throw r.error; }
  }catch(err){ msg.textContent="Save failed: "+(err.message||err); return; }
  closeModal(); toast(oldName?"Employee saved":"Employee added"); await reloadRender();
}
function deleteEmployee(name){
  if(!need('employees'))return;
  const loans=STORE.loans.filter(l=>l.employee===name).length;
  if(loans){confirmModal(`Delete <b>${esc(name)}</b>?`,`This employee has ${loans} loan${loans>1?'s':''}. Delete those loans first.`,null,"Got it");return;}
  confirmModal(`Remove <b>${esc(name)}</b> from the employee list?`,`This cannot be undone.`,(async()=>{ const {error}=await sb.from("employees").delete().eq("name",name); if(error){toast("Delete failed: "+error.message);return;} toast("Employee removed"); await reloadRender(); }));
}

function confirmModal(title,body,onYes,okOnlyLabel){
  modal(`<h3>${title}</h3><p class="muted" style="margin:0 0 4px">${body}</p>
    <div class="foot">${onYes?`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="cfYes">Delete</button>`:`<button class="btn btn-primary" onclick="closeModal()">${okOnlyLabel||'OK'}</button>`}</div>`,"narrow");
  if(onYes)document.getElementById("cfYes").onclick=()=>{closeModal();onYes();};
}

function openPw(){ modal(`<h3>Change password</h3>
  <div class="field"><label>New password</label><input id="pwNew" type="password"></div>
  <div class="field"><label>Confirm new password</label><input id="pwNew2" type="password"></div>
  <div class="form-msg" id="pwErr"></div><div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePw()">Save</button></div>`,"narrow"); }
async function savePw(){
  const n=document.getElementById("pwNew").value,n2=document.getElementById("pwNew2").value,err=document.getElementById("pwErr");
  if(n.length<6){err.textContent="New password must be at least 6 characters.";return;}
  if(n!==n2){err.textContent="New passwords do not match.";return;}
  const {error}=await sb.auth.updateUser({password:n}); if(error){err.textContent=error.message;return;}
  closeModal(); toast("Password updated");
}

function exportData(){
  const blob=new Blob([JSON.stringify(STORE,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="loan-monitoring-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); URL.revokeObjectURL(a.href); toast("Backup downloaded");
}

/* ===================== INIT ===================== */
sb.auth.getSession().then(({data})=>{ if(data&&data.session){ onSignedIn(); } else { const p=document.getElementById("p"); if(p)p.focus(); } });
</script>
